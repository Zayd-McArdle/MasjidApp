[package]
name = "masjid_app_admin_manager_api"
version = "0.1.0"
edition = "2024"

[dependencies]
masjid_app_api_library = { path = "../masjid_app_api_library" }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }

bcrypt = "0.19.3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "mysql", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
validator = { version = "0.21.0", features = ["derive"] }
async-trait = "0.1.92"
mockall = "0.15.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
tracing = "0.1.44"
sha2 = "0.10.9"
enum_stringify = "0.6.5"