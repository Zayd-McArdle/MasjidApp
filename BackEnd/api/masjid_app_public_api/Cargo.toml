[package]
name = "masjid_app_public_api"
version = "0.1.0"
edition = "2024"

[dependencies]
masjid_app_api_library = { path = "../masjid_app_api_library" }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "mysql", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
validator = { version = "0.21.0", features = ["derive"] }
async-trait = "0.1.92"
mockall = "0.15.0"
tracing = "0.1.44"
[[bin]]
name = "masjid_app_public_api"
path = "src/main.rs"
[lib]
name = "masjid_app_public_api"
path = "src/lib.rs"
